<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello Agentic World</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #1e293b, #020617 60%);
      color: #e2e8f0;
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 36rem;
    }
    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
    }
    p { margin: 0; line-height: 1.5; color: #94a3b8; }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid #334155;
      font-size: 0.85rem;
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, agentic world</h1>
    <p>Virtual Deployment Test — a tiny static site deployed from GitHub to Vercel.</p>
    <div class="badge">hello-agentic-world · Hobby · $0</div>
  </main>
</body>
</html>
